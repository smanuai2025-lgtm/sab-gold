<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - SabeekaGold</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Cairo', sans-serif; box-sizing: border-box; }
        
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            overflow-x: hidden;
        }
        
        .auth-bg {
            background: linear-gradient(135deg, #0a0e17 0%, #1a1f2e 50%, #0a0e17 100%);
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
        }
        
        .auth-bg::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 70% 30%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
                        radial-gradient(circle at 30% 70%, rgba(218, 165, 32, 0.04) 0%, transparent 40%);
            pointer-events: none;
        }
        
        .glass-card {
            background: rgba(26, 31, 46, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(16, 185, 129, 0.2);
            box-shadow: 0 15px 40px -10px rgba(0, 0, 0, 0.5);
        }
        
        .input-field {
            background: rgba(10, 14, 23, 0.6);
            border: 1px solid rgba(113, 113, 122, 0.3);
            transition: all 0.3s ease;
            font-size: 16px; /* منع التكبير في iOS */
        }
        
        .input-field:focus {
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            outline: none;
        }
        
        .btn-emerald {
            background: linear-gradient(135deg, #059669 0%, #10b981 50%, #047857 100%);
            color: white;
            font-weight: 700;
            transition: all 0.3s ease;
        }
        
        .btn-emerald:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
        }
        
        .btn-emerald:active {
            transform: translateY(0);
        }
        
        .strength-bar {
            height: 3px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        
        /* تصميم متجاوب */
        @media (max-width: 640px) {
            .glass-card {
                padding: 1.25rem !important;
                border-radius: 1.25rem !important;
            }
            .auth-container {
                padding: 1rem !important;
            }
            .logo-section img {
                height: 2.5rem !important;
            }
            .logo-section h1 {
                font-size: 1.125rem !important;
            }
            .logo-section p {
                font-size: 0.875rem !important;
            }
            .form-label {
                font-size: 0.75rem !important;
                margin-bottom: 0.375rem !important;
            }
            .input-field {
                padding: 0.625rem 0.75rem !important;
                padding-right: 2.5rem !important;
            }
        }
        
        @media (max-height: 800px) {
            .auth-container {
                padding-top: 0.75rem !important;
                padding-bottom: 0.75rem !important;
            }
            .logo-section {
                margin-bottom: 0.75rem !important;
            }
            .form-spacing {
                gap: 0.75rem !important;
            }
        }
    </style>
</head>
<body class="auth-bg">
    <div class="auth-container relative z-10 min-h-screen min-h-[100dvh] flex items-center justify-center p-3 sm:p-4 py-4 sm:py-8">
        <div class="w-full max-w-sm sm:max-w-md">
            <!-- Logo -->
            <div class="logo-section text-center mb-4 sm:mb-6">
                <a href="../index.html" class="inline-block">
                    <img src="../images/logo.png" alt="SabeekaGold" class="h-10 sm:h-12 mx-auto mb-2">
                </a>
                <h1 class="text-lg sm:text-xl font-bold text-white mb-1">إنشاء حساب جديد</h1>
                <p class="text-zinc-400 text-xs sm:text-sm">انضم إلينا وابدأ رحلة الاستثمار في الذهب</p>
            </div>
            
            <!-- Register Card -->
            <div class="glass-card rounded-2xl sm:rounded-3xl p-4 sm:p-6">
                <!-- Error/Success Message -->
                <div id="error-message" class="hidden mb-3 sm:mb-4 p-3 bg-rose-500/10 border border-rose-500/30 rounded-lg text-rose-400 text-xs sm:text-sm text-center"></div>
                <div id="success-message" class="hidden mb-3 sm:mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 rounded-lg text-emerald-400 text-xs sm:text-sm text-center"></div>
                
                <!-- Register Form -->
                <form id="register-form" class="form-spacing space-y-3 sm:space-y-4">
                    <!-- Name -->
                    <div>
                        <label class="form-label block text-xs sm:text-sm font-medium text-zinc-400 mb-1.5">الاسم الكامل</label>
                        <div class="relative">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </span>
                            <input type="text" id="name" required
                                class="input-field w-full pr-10 pl-3 py-2.5 rounded-lg text-white text-sm placeholder-zinc-500"
                                placeholder="أحمد محمد">
                        </div>
                    </div>
                    
                    <!-- Email -->
                    <div>
                        <label class="form-label block text-xs sm:text-sm font-medium text-zinc-400 mb-1.5">البريد الإلكتروني</label>
                        <div class="relative">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                                </svg>
                            </span>
                            <input type="email" id="email" required
                                class="input-field w-full pr-10 pl-3 py-2.5 rounded-lg text-white text-sm placeholder-zinc-500"
                                placeholder="example@email.com">
                        </div>
                    </div>
                    
                    <!-- Phone -->
                    <div>
                        <label class="form-label block text-xs sm:text-sm font-medium text-zinc-400 mb-1.5">رقم الهاتف (اختياري)</label>
                        <div class="relative">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                                </svg>
                            </span>
                            <input type="tel" id="phone"
                                class="input-field w-full pr-10 pl-3 py-2.5 rounded-lg text-white text-sm placeholder-zinc-500"
                                placeholder="+965 XXXX XXXX">
                        </div>
                    </div>
                    
                    <!-- Password -->
                    <div>
                        <label class="form-label block text-xs sm:text-sm font-medium text-zinc-400 mb-1.5">كلمة المرور</label>
                        <div class="relative">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </span>
                            <input type="password" id="password" required minlength="6"
                                class="input-field w-full pr-10 pl-10 py-2.5 rounded-lg text-white text-sm placeholder-zinc-500"
                                placeholder="6 أحرف على الأقل"
                                oninput="checkPasswordStrength()">
                            <button type="button" onclick="togglePassword('password')" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-emerald-400 transition-colors">
                                <svg class="w-4 h-4 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                        <!-- Password Strength -->
                        <div class="mt-1.5 flex gap-1">
                            <div id="strength-1" class="strength-bar flex-1 bg-zinc-700"></div>
                            <div id="strength-2" class="strength-bar flex-1 bg-zinc-700"></div>
                            <div id="strength-3" class="strength-bar flex-1 bg-zinc-700"></div>
                            <div id="strength-4" class="strength-bar flex-1 bg-zinc-700"></div>
                        </div>
                        <p id="strength-text" class="text-xs text-zinc-500 mt-0.5"></p>
                    </div>
                    
                    <!-- Confirm Password -->
                    <div>
                        <label class="form-label block text-xs sm:text-sm font-medium text-zinc-400 mb-1.5">تأكيد كلمة المرور</label>
                        <div class="relative">
                            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-zinc-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                                </svg>
                            </span>
                            <input type="password" id="confirm-password" required
                                class="input-field w-full pr-10 pl-10 py-2.5 rounded-lg text-white text-sm placeholder-zinc-500"
                                placeholder="أعد إدخال كلمة المرور">
                            <button type="button" onclick="togglePassword('confirm-password')" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 hover:text-emerald-400 transition-colors">
                                <svg class="w-4 h-4 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Terms -->
                    <div class="flex items-start gap-2">
                        <input type="checkbox" id="terms" required class="w-4 h-4 mt-0.5 rounded border-zinc-600 bg-zinc-800 text-emerald-500 focus:ring-emerald-500">
                        <label for="terms" class="text-xs sm:text-sm text-zinc-400">
                            أوافق على <a href="#" class="text-emerald-400 hover:underline">شروط الاستخدام</a> و <a href="#" class="text-emerald-400 hover:underline">سياسة الخصوصية</a>
                        </label>
                    </div>
                    
                    <!-- Submit Button -->
                    <button type="submit" class="btn-emerald w-full py-2.5 sm:py-3 rounded-lg sm:rounded-xl text-sm sm:text-base font-bold">
                        إنشاء الحساب
                    </button>
                </form>
                
                <!-- Login Link -->
                <p class="text-center mt-4 sm:mt-5 text-zinc-400 text-xs sm:text-sm">
                    لديك حساب بالفعل؟
                    <a href="login.html" class="text-emerald-400 hover:text-emerald-300 font-medium transition-colors">تسجيل الدخول</a>
                </p>
            </div>
            
            <!-- Back to Home -->
            <div class="text-center mt-4 sm:mt-5">
                <a href="../index.html" class="text-zinc-500 hover:text-emerald-400 transition-colors text-xs sm:text-sm flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5 rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                    العودة للرئيسية
                </a>
            </div>
        </div>
    </div>
    
    <script src="../js/auth.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
        
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.length >= 10) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
            const texts = ['ضعيفة جداً', 'ضعيفة', 'متوسطة', 'قوية', 'قوية جداً'];
            
            for (let i = 1; i <= 4; i++) {
                const bar = document.getElementById(`strength-${i}`);
                if (i <= strength) {
                    bar.style.background = colors[Math.min(strength - 1, 3)];
                } else {
                    bar.style.background = '#3f3f46';
                }
            }
            
            document.getElementById('strength-text').textContent = password ? texts[Math.min(strength, 4)] : '';
            document.getElementById('strength-text').style.color = colors[Math.min(strength - 1, 3)] || '#71717a';
        }
        
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');
            
            // Validate passwords match
            if (password !== confirmPassword) {
                errorDiv.textContent = 'كلمتا المرور غير متطابقتين';
                errorDiv.classList.remove('hidden');
                return;
            }
            
            const result = AuthService.register({ name, email, phone, password });
            
            if (result.success) {
                successDiv.textContent = 'تم إنشاء الحساب بنجاح! جاري تحويلك...';
                successDiv.classList.remove('hidden');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } else {
                errorDiv.textContent = result.error;
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
